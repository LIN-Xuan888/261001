<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市散步</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>城市散步</h1>
    <nav>
      <a href="#event">活動資訊</a>
      <a href="#signup">立即報名</a>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow">城市漫遊 · 周末限定</p>
    <h2>慢下來，重新感受城市的節奏</h2>
    <p>一起走進巷弄、咖啡店、老街與公園，從微小細節裡看見城市的故事。</p>
  </section>

  <section class="event-card with-badge">
    <span class="badge">剩 8 位</span>
    <h3>活動資訊</h3>
    <ul>
      <li>時間：09:00 - 15:00</li>
      <li>地點：中山路老街區</li>
      <li>對象：18 歲以上 / 朋友同伴</li>
    </ul>
  </section>

  <section class="notice-card notice-with-badge">
    <span class="notice-badge">提醒</span>
    <h3>注意事項</h3>
    <ul>
      <li>請提前 15 分鐘到場</li>
      <li>穿著舒適鞋款更方便走路</li>
      <li>活動當天請攜帶水壺與小傘</li>
    </ul>
  </section>
</body>
</html>
